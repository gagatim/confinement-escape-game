"use strict";
/* ===================== DATA: ITEMS ===================== */

/* ===================== DATA: ROOMS ===================== */
// floor: display row (0=top/201·202 ... 8=B701). order: left-right position within that row for rendering.
function R(id,name,floor,order,opts){ return Object.assign({id,name,floor,order,neighbors:[],draw:0,stock:{}},opts||{}); }
const ROOMS = {
  "201":R("201","基因庫",0,0,{special:"gene"}),
  "202":R("202","停機坪",0,1,{special:"helipad"}),
  "101":R("101","水塔",1,0,{draw:4,stock:{water:10}}),
  "102":R("102","激光室",1,1,{special:"laser"}),
  "103":R("103","",1,2,{}),
  "104":R("104","",1,3,{}),
  "B101":R("B101","控制室",2,0,{special:"control"}),
  "B102":R("B102","",2,1,{}),
  "B103":R("B103","",2,2,{}),
  "B104":R("B104","",2,3,{}),
  "B105":R("B105","回收站",2,4,{special:"slide"}),
  "B106":R("B106","",2,5,{}),
  "B107":R("B107","武器庫",2,6,{draw:2,stock:{knife:5,pistol:2,shotgun:1}}),
  "B201":R("B201","",3,0,{}),

  "B204":R("B204","餐廳",3,3,{special:"canteen"}),
  "B205":R("B205","",3,4,{}),

  "B301":R("B301","藥房",4,0,{draw:2,stock:{pill:3,adrenaline:3}}),

  "B303":R("B303","",4,2,{}),

  "B306":R("B306","",4,5,{}),
  "B307":R("B307","",4,6,{}),
  "B308":R("B308","",4,7,{}),
  "B501":R("B501","大倉庫",5,0,{draw:3,stock:{water:5,food:5,knife:3,wine:2,pill:2,adrenaline:2,pistol:1,gold:1,shotgun:1},poisonRequires:["B401","B502"]}),
  "B401":R("B401","",5,1,{}),
  "B402":R("B402","",5,2,{}),
  "B403":R("B403","傳送室",5,3,{special:"teleport"}),
  "B404":R("B404","",5,4,{}),
  "B405":R("B405","",5,5,{}),
  "B502":R("B502","",6,1,{}),
  "B503":R("B503","垃圾場",6,2,{draw:5,stock:{trash:20,rope:1,gasmask:1,rocket:1,dimpocket:1,recycledevice:1},noGold:true,dumpCap:2}),
  "B504":R("B504","",6,4,{}),
  "B505":R("B505","糧倉",6,5,{draw:4,stock:{food:10}}),
  "B601":R("B601","酒窖",7,0,{draw:2,stock:{wine:6}}),
  "B602":R("B602","",7,1,{}),
  "B603":R("B603","",7,2,{}),
  "B604":R("B604","",7,3,{}),
  "B701":R("B701","停屍間",8,0,{special:"mortuary",draw:3,stock:{}})
};
const FLOOR_LABEL = {0:"2F",1:"1F",2:"B1",3:"B2",4:"B3",5:"B4",6:"B5",7:"B6",8:"B7"};
// Re-derived room-by-room from img1.jpg using a shared 9-column grid per floor (see commit notes):
// the atrium/chasm blocks left-cluster <-> right-cluster adjacency on every floor EXCEPT B1, which
// has a visible footbridge (B105<->B106). Wide rooms (spanning multiple columns, e.g. B206/B501/B503)
// connect to every room whose column they overlap, above and below.
const ADJ = {
  "201":["102"], "202":["104","103"],
  "101":["102","B102"], "102":["101","201","B104","B103"], "103":["104","B106","202"], "104":["103","202","B107"],
  "B101":["B102","B201"], "B102":["B101","B103","101","B202"], "B103":["B102","B104","B203","102"],
  "B104":["B103","B105","102","B204"], "B105":["B104","B106","B205"], "B106":["B105","B107","103","B206"],
  "B107":["B106","104","B206"],
  "B201":["B101","B202","B301"], "B202":["B201","B203","B102","B302"], "B203":["B202","B204","B103","B303"],
  "B204":["B203","B205","B104","B304"], "B205":["B204","B105","B305"], "B206":["B106","B107","B306","B307","B308"],
  "B301":["B302","B201","B501"], "B302":["B301","B303","B202","B501"], "B303":["B302","B304","B203","B401"],
  "B304":["B303","B305","B204","B402"], "B305":["B304","B205","B402"],
  "B306":["B307","B206","B403"], "B307":["B306","B308","B206","B404"], "B308":["B307","B206","B405"],
  "B501":["B301","B302","B401","B502","B601"], "B401":["B501","B402","B303","B502"],
  "B402":["B401","B304","B305","B503"], "B403":["B404","B306","B504"],
  "B404":["B403","B405","B307","B504","B505"], "B405":["B404","B308","B505"],
  "B502":["B501","B503","B401","B601"], "B503":["B502","B402","B602"],
  "B504":["B505","B403","B404","B604"], "B505":["B504","B405","B604","B404"],
  "B601":["B502","B602","B501"], "B602":["B601","B603","B503","B701"], "B603":["B602","B604"],
  "B604":["B603","B505","B504"], "B701":["B602"]
};
const MEETING_ROOM = "B204"; // 會議室 hub: treated as the assembly room players return to between rounds
const HELI_TARGETS = ["B101","101","B103","201","B105"];
const SPAWN_ROOMS = ["103","B103","B303","B307","B402","B603"]; // 紅色出生點 marked on img1.jpg
const AIRDROP_SCHEDULE = [null,["knife","knife"],["wine","wine"],["water","food"],["pistol"],["adrenaline"],["pill"]];

function bfsPath(from,to,maxSteps){
  if(from===to) return [from];
  let q=[[from]], seen=new Set([from]);
  while(q.length){
    const path=q.shift();
    const node=path[path.length-1];
    if(path.length-1>=maxSteps) continue;
    for(const n of (ADJ[node]||[])){
      if(seen.has(n)) continue;
      seen.add(n);
      const np=[...path,n];
      if(n===to) return np;
      q.push(np);
    }
  }
  return null;
}
function bfsDist(from,to){
  if(from===to) return 0;
  let q=[[from,0]], seen=new Set([from]);
  while(q.length){
    const [node,d]=q.shift();
    for(const n of (ADJ[node]||[])){
      if(seen.has(n)) continue;
      seen.add(n);
      if(n===to) return d+1;
      q.push([n,d+1]);
    }
  }
  return Infinity;
}
function reachableRooms(from,maxSteps){
  let out={[from]:0}, q=[[from,0]];
  while(q.length){
    const [node,d]=q.shift();
    if(d>=maxSteps) continue;
    for(const n of (ADJ[node]||[])){
      if(out[n]===undefined || out[n]>d+1){ out[n]=d+1; q.push([n,d+1]); }
    }
  }
  return out;
}

/* ===================== DATA: PROFESSIONS ===================== */

  fatty:{name:"肥宅", skills:[
    {name:"肥肉坦克", desc:"受到近戰傷害、槍械傷害時，最終傷害 -2。", passive:true},

  ]},
  bomb:{name:"防爆小組", skills:[
    {name:"防爆盾牌", desc:"永久抵擋槍械傷害 3 點。", passive:true},
    {name:"爆破緩衝", desc:"火箭筒傷害 -1。", passive:true}

/* ---------- player factory ---------- */
const AI_NAMES=["阿凱","小美","老周","阿德","阿珍","小胖","阿宏","阿玲"];
function makePlayer(id,isAI,profId,stats,name){
  const prof=PROFESSIONS[profId];
  const p={
    id, name: name || (isAI? AI_NAMES[id%AI_NAMES.length]+"#"+id : "你"),
    isAI, prof:profId,
    power:stats.power, speed:stats.speed, carry:stats.carry,
    hp:10, maxhp:10, alive:true, ghost:false, ghostDrainTotal:0,
    room: MEETING_ROOM, spawnRoom:null, stepsLeft:0,
    inv:[], // array of item ids
    flags:{gamblerUses:0, gamblerWinUses:0, gamblerForceWin:false, gamblerBonusOps:0,
      scavengerUses:0, truckerUses:0, truckerDoubled:false, truckerDiscardedNonTrash:false,
      chemistUses:0, embalmerUses:0, hackerUses:0, hackerUsedRooms:[],
      tamerUses:0, geneUses:0, climberDietUsed:false, adrenalineRound:0, dietThisRound:false,
      goldUsedThisRound:false, visited102:false, pendingHeli:false, remoteRoomOverride:null,
      pendingItemUses:[]},
    pendingActions:{targetRoom:null, movementDone:false, roomActed:false},
    weaponWeightless: profId==="merc",
    weightlessGold: profId==="tycoon",
    weightlessTrash: profId==="scavenger",
    weightlessWine: profId==="bartender"
  };
  return p;
}
function effectiveCarryCap(p){
  return p.carry + (p.inv.includes("dimpocket") ? 9999 : 0);
}
function usedCarry(p){
  let n=0;
  for(const it of p.inv){
    if(it==="trash" && p.weightlessTrash) continue;
    if(it==="gold" && p.weightlessGold) continue;
    if(it==="wine" && p.weightlessWine) continue;
    if(ITEMS[it].weapon && p.weaponWeightless) continue;
    n++;
  }
  return n;
}
function carryRoom(p){ return effectiveCarryCap(p)-usedCarry(p); }
function addItem(p,item,qty){
  qty=qty||1;
  for(let i=0;i<qty;i++){
    if(item!=="__forced" && carryRoom(p)<=0 && effectiveCarryCap(p)<9000) return false;
    p.inv.push(item);
  }
  return true;
}
function removeItem(p,item){
  const i=p.inv.indexOf(item);
  if(i>=0){ p.inv.splice(i,1); return true; }
  return false;
}
function countItem(p,item){ return p.inv.filter(x=>x===item).length; }
function hasGun(p){ return p.inv.some(x=>ITEMS[x].gun); }
function combatPower(p){
  let base=p.power;
  for(const it of p.inv){ if(ITEMS[it].weapon) base+=ITEMS[it].power; }
  if(p.prof==="tamer") ; // already added at init to base power
  return base;
}

/* ===================== GAME SETUP ===================== */
function startGame(){
  const n=+document.getElementById("playerCount").value;
  const stats={power:+document.getElementById("allocPower").value, speed:+document.getElementById("allocSpeed").value, carry:+document.getElementById("allocCarry").value};
  const you=makePlayer(0,false,selectedProf,stats,"你");
  const usedProfs=new Set([selectedProf]);
  const profIds=Object.keys(PROFESSIONS);
  const players=[you];
  for(let i=1;i<n;i++){
    let pool=profIds.filter(x=>!usedProfs.has(x));
    if(pool.length===0){ pool=profIds; usedProfs.clear(); }
    const pid=pool[Math.floor(Math.random()*pool.length)];
    usedProfs.add(pid);
    const pw=Math.floor(Math.random()*5)+2, sp=Math.floor(Math.random()*4)+1;
    const cap = pid==="geneFreak"?12:10;
    let power=Math.min(pw, pid==="geneFreak"?5:99);
    let speed=sp;
    let carry=Math.max(1,cap-power-speed);
    if(power+speed+carry>cap){ carry=Math.max(1,cap-power-speed); }
    players.push(makePlayer(i,true,pid,{power,speed,carry}));
  }
  STATE={round:1, phase:"positioning", players, poisoned:new Set(), voteCounts:{}, discardPile:[], gameOver:false};
  // profession init effects
  players.forEach(p=>{
    if(p.prof==="tamer"){ p.power+=1; p.carry+=1; }
    if(p.prof==="tycoon"){
      addItem(p,"__forced"); p.inv.push("gold"); p.inv.push("gold"); p.inv.push("gold");
      p.inv=p.inv.filter(x=>x!=="__forced");
      ROOMS["B206"].stock.gold=Math.max(0,(ROOMS["B206"].stock.gold||0)-2);
      ROOMS["B501"].stock.gold=Math.max(0,(ROOMS["B501"].stock.gold||0)-1);
    }
    if(p.prof==="bartender"){
      p.inv.push("wine"); p.inv.push("wine");
      ROOMS["B601"].stock.wine=Math.max(0,(ROOMS["B601"].stock.wine||0)-2);
    }
  });
  // AI players secretly pick a spawn now; human picks via the spawn-select screen next.
  players.filter(p=>p.isAI).forEach(p=>{ p.spawnRoom=chooseAISpawn(p); });
  document.getElementById("setup").classList.add("hidden");
  renderSpawnGrid();
  document.getElementById("spawnSelect").classList.remove("hidden");
}

/* ---------- spawn point selection (紅色出生點) ---------- */
function chooseAISpawn(p){
  // weighted random: rooms closer to rooms with starting stock score higher, plus a flat random component
  const weights=SPAWN_ROOMS.map(r=>{
    let w=1.5;
    Object.values(ROOMS).forEach(room=>{
      if(Object.values(room.stock).some(v=>v>0)){
        const d=bfsDist(r,room.id);
        if(d!==Infinity) w+=3/(1+d);
      }
    });
    return w;
  });
  const total=weights.reduce((a,b)=>a+b,0);
  let roll=Math.random()*total;
  for(let i=0;i<SPAWN_ROOMS.length;i++){ roll-=weights[i]; if(roll<=0) return SPAWN_ROOMS[i]; }
  return SPAWN_ROOMS[SPAWN_ROOMS.length-1];
}
function renderSpawnGrid(){
  const grid=document.getElementById("spawnGrid"); grid.innerHTML="";
  SPAWN_ROOMS.forEach(r=>{
    const div=document.createElement("div");
    div.className="prof-card"; div.dataset.room=r;
    div.innerHTML=`<h3>${r} ${ROOMS[r].name||""}</h3><div class="sk">紅色出生點</div>`;
    div.addEventListener("click",()=>{
      document.querySelectorAll("#spawnGrid .prof-card").forEach(c=>c.classList.remove("selected"));
      div.classList.add("selected");
      you().spawnRoom=r;
      document.getElementById("confirmSpawnBtn").disabled=false;
    });
    grid.appendChild(div);
  });
}
document.getElementById("confirmSpawnBtn").addEventListener("click",()=>{
  document.getElementById("spawnSelect").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  logRound(1);
  log("遊戲開始！你的職業：<b>"+PROFESSIONS[you().prof].name+"</b>。你秘密選擇了出生點「"+you().spawnRoom+" "+(ROOMS[you().spawnRoom].name||"")+"」。");
  beginRound();
});

/* ===================== ROUND FLOW ===================== */
function you(){ return STATE.players[0]; }
function alivePlayers(){ return STATE.players.filter(p=>p.alive); }
function playersInRoom(room,excludeGhosts){
  return STATE.players.filter(p=>p.room===room && p.alive && (!excludeGhosts || !p.ghost));
}
function beginRound(){
  STATE.players.forEach(p=>{
    p.room = (STATE.round===1 && p.spawnRoom) ? p.spawnRoom : MEETING_ROOM;
    p.stepsLeft = p.speed;
    if(p.flags.adrenalineRound===STATE.round-1+1){} // no-op placeholder
    p.flags.goldUsedThisRound=false;
    p.flags.dietThisRound=false;
    p.pendingActions={targetRoom:null, movementDone:false, roomActed:false};
  });
  STATE.voteCounts={};
  renderAll();
}
document.getElementById("endTurnBtn").addEventListener("click",()=>{
  runAIRound();
  settleRound();
});

/* ---------- movement ---------- */
function tryMove(p,target){
  if(p.ghost){ p.room=target; return true; } // ghosts move freely, no step cost enforced strictly
  const dist=bfsDist(p.room,target);
  let steps = p.stepsLeft;
  if(dist===Infinity || dist>steps) return false;
  p.room=target; p.stepsLeft-=dist;
  return true;
}
function playerEffectiveSpeed(p){
  let s=p.speed;
  if(p.flags.truckerDoubled) s=Math.min(10,s*2);
  return s;
}

/* ---------- room chip click (human) ---------- */
function onRoomClick(roomId){
  const p=you();
  if(STATE.phase!=="positioning" || STATE.gameOver) return;
  const dist=bfsDist(p.room,roomId);
  if(dist===Infinity || dist>p.stepsLeft){ flashMsg("步數不足或無法到達"); return; }
  p.room=roomId; p.stepsLeft-=dist;
  if(roomId==="102"){ applyLaser(p); }
  renderAll();
}
function flashMsg(m){ log(`<i class="muted">${m}</i>`); }

/* ===================== ROOM ACTIONS (human) ===================== */
function drawFromRoom(p,roomId,maxDraw){
  const room=ROOMS[roomId];
  let drawn=0;
  maxDraw = maxDraw!==undefined?maxDraw:room.draw;
  let gained=[];
  const isDump=roomId==="B503";
  let nonTrashGained=0;
  for(let i=0;i<maxDraw;i++){
    const stockKeys=Object.keys(room.stock).filter(k=>room.stock[k]>0 && !(isDump && k==="gold"));
    if(stockKeys.length===0) break;
    if(isDump && nonTrashGained>=room.dumpCap && stockKeys.some(k=>k!=="trash") && stockKeys.length===1 && stockKeys[0]!=="trash") break;
    const pick=stockKeys[Math.floor(Math.random()*stockKeys.length)];
    if(isDump && pick!=="trash" && nonTrashGained>=room.dumpCap) continue;
    if(carryRoom(p)<=0 && !(pick==="trash"&&p.weightlessTrash) && !(pick==="gold"&&p.weightlessGold) && !(pick==="wine"&&p.weightlessWine) && !(ITEMS[pick].weapon&&p.weaponWeightless)) break;
    room.stock[pick]--; p.inv.push(pick); gained.push(pick); drawn++;
    if(pick!=="trash") nonTrashGained++;
    // 拾荒嗅覺: 50% chance extra trash from junkyard stock (deducted from B503), doesn't cost carry
    if(p.prof==="scavenger" && Math.random()<0.5 && ROOMS["B503"].stock.trash>0){
      ROOMS["B503"].stock.trash--; p.inv.push("trash"); gained.push("trash(拾荒嗅覺)");
    }
  }
  return gained;
}
function doRoomAction(){
  const p=you();
  const room=ROOMS[p.room];
  if(room.draw>0){
    let maxDraw=room.draw;
    if(p.flags.gamblerBonusOps>0){ maxDraw*=2; p.flags.gamblerBonusOps--; }
    const gained=drawFromRoom(p,p.room,maxDraw);
    log("在「"+(room.name||p.room)+"」搜索到: "+(gained.length? gained.map(g=>ITEMS[g]?ITEMS[g].name:g).join("、"):"（無收穫）"));
  }
  if(room.special) doSpecialRoom(p,room);
  renderAll();
}
function doSpecialRoom(p,room){
  switch(room.special){
    case "gene":
      p.power++; p.speed++; p.carry++;
      log(p.name+" 於基因庫：三項屬性各永久 +1。");
      break;
    case "surgery": {
      const here=playersInRoom(p.room,true);
      if(here.length===2){ log(p.room+" 手術室：2人在場，結算階段將各恢復4點生命。"); here.forEach(pl=>pl.flags.__surgeryHeal=true); }
      else if(here.length>=3){ log(p.room+" 手術室：3人以上，將直接觸發混戰。"); }
      break;
    }
    case "canteen": p.flags.dietThisRound=true; log(p.name+" 於餐廳：本輪免上交水/糧。"); break;
    case "respec": {
      const cap = p.prof==="geneFreak"?12:10;
      openRespecModal(p,cap);
      break;
    }
    case "slide": if(carrySpendStep(p)){ p.room="B503"; log(p.name+" 經回收站滑至垃圾場。"); } break;
    case "teleport": openTeleportModal(p); break;
    case "control": openControlModal(p); break;
    case "helipad": p.flags.pendingHeli=true; log(p.name+" 於停機坪：下一輪可搭乘直昇機。"); collectAirdrop(p); break;
    case "mortuary": break;
    case "laser": break;
  }
}
function carrySpendStep(p){
  if(p.stepsLeft<1) { flashMsg("步數不足"); return false; }
  p.stepsLeft--; return true;
}
function collectAirdrop(p){
  const sched=AIRDROP_SCHEDULE[STATE.round];
  if(!sched) return;
  const bag = ROOMS["202"].airdropBag = ROOMS["202"].airdropBag || [];
  sched.forEach(it=>bag.push(it));
  if(bag.length){
    const pick=bag.shift();
    if(carryRoom(p)>0){ p.inv.push(pick); log(p.name+" 從停機坪空投獲得: "+ITEMS[pick].name); }
  }
}

  openModal(`<h3>傳送室：選擇目的地</h3><select id="tpSel">${opts}</select><br><br>

/* ===================== ITEM USE ===================== */
// 附錄二: 水/糧/藥片/腎上腺素/酒 are all "結算階段公開使用" — clicking them during the action
// phase only DECLARES intent; the actual effect is resolved publicly during settlement
// (resolvePendingItemUses), same pattern as the rocket launcher's queued targeting.
const SETTLEMENT_TIMED_ITEMS=["water","food","pill","adrenaline","wine"];
function useItem(p,item){
  if(!SETTLEMENT_TIMED_ITEMS.includes(item)) return; // passive-hold items are never "used" via click
  if(!removeItem(p,item)) return;
  p.flags.pendingItemUses.push(item);
  log(p.name+" 宣告使用「"+ITEMS[item].name+"」（結算階段公開生效）。");
  renderAll();
}
function resolvePendingItemUses(p){
  const uses=p.flags.pendingItemUses||[];
  uses.forEach(item=>{
    STATE.discardPile.push(item);
    switch(item){
      case "water": case "food": p.flags["consumed_"+item]=true; log(p.name+" 結算：使用了"+ITEMS[item].name+"。"); break;
      case "pill": p.hp=Math.min(p.maxhp,p.hp+2); log(p.name+" 結算：服用藥片，恢復2點生命。","heal"); break;
      case "adrenaline":
        p.flags.adrenalineActive=true; log(p.name+" 結算：注射腎上腺素，下輪速度變10，本輪不會致死。","heal"); break;
      case "wine": {
        const roll=Math.floor(Math.random()*6)+1;
        let msg="結算：酒(擲骰"+roll+"): ";
        if(roll===1){ p.inv=[]; msg+="丟棄所有道具卡！"; }
        else if(roll===2){ msg+="無事發生。"; }
        else if(roll===3){ p.power++; msg+="武力永久+1。"; }
        else if(roll===4){ p.speed++; msg+="速度永久+1。"; }
        else if(roll===5){ p.carry++; msg+="負重永久+1。"; }
        else { p.hp=Math.min(p.maxhp,p.hp+2); msg+="生命值+2。"; }
        log(p.name+" "+msg,"heal");
        break;
      }
    }
  });
  p.flags.pendingItemUses=[];
}

/* ===================== AI ===================== */
function aiChooseTarget(p){
  const reach=reachableRooms(p.room, playerEffectiveSpeed(p) + p.stepsLeft-p.speed>=0?p.stepsLeft:p.speed);
  const cands=Object.keys(reach);
  let best=p.room, bestScore=-Infinity;
  for(const r of cands){
    let score=Math.random()*2;
    const room=ROOMS[r];
    if(p.hp<=5 && (room.stock.pill||room.stock.adrenaline)) score+=5;
    if(!hasGun(p) && (room.stock.pistol||room.stock.shotgun||room.stock.knife)) score+=3;
    if(STATE.round>=2 && (room.stock.water||room.stock.food)) score+=2;
    if(room.draw>0) score+=1.5;
    if(STATE.poisoned.has(r)) score-=6;
    if(r==="102") score-=4;
    if(r===p.room) score-=0.5;
    if(score>bestScore){ bestScore=score; best=r; }
  }
  return best;
}
function runAIRound(){
  alivePlayers().filter(p=>p.isAI).forEach(p=>{
    if(p.ghost){ // wander randomly
      const opts=ADJ[p.room]||[]; if(opts.length) p.room=opts[Math.floor(Math.random()*opts.length)];
      return;
    }
    const target=aiChooseTarget(p);
    const dist=bfsDist(p.room,target);
    if(dist!==Infinity && dist<=p.stepsLeft){ p.room=target; p.stepsLeft-=dist; }
    if(p.room==="102") applyLaser(p);
    const room=ROOMS[p.room];
    if(room.draw>0){ drawFromRoom(p,p.room,room.draw); }
    if(room.special==="gene"){ p.power++; p.speed++; p.carry++; }
    if(room.special==="respec"){ /* AI keeps stats */ }
    // simple item usage: declare now, effect resolves at settlement (same as the human path)
    if(p.hp<=4 && countItem(p,"pill")>0){ removeItem(p,"pill"); p.flags.pendingItemUses.push("pill"); }
    if(STATE.round>=2){
      if(countItem(p,"water")>0){ removeItem(p,"water"); p.flags.pendingItemUses.push("water"); }
      if(countItem(p,"food")>0){ removeItem(p,"food"); p.flags.pendingItemUses.push("food"); }
    }
    // poison vote: avoid own room, pick a random room not own
    const voteRoom=Object.keys(ROOMS).filter(r=>r!==p.room)[Math.floor(Math.random()*(Object.keys(ROOMS).length-1))];
    STATE.voteCounts[voteRoom]=(STATE.voteCounts[voteRoom]||0)+1;
  });
}

/* ===================== SETTLEMENT ===================== */
function applyLaser(p){
  p.pendingLaser=true;
}
function damagePlayer(p,amount,cause){
  if(amount<=0) return;
  if(p.flags.adrenalineActive){ p.hp=Math.max(1,p.hp-amount); return; }
  p.hp-=amount;
  if(p.hp<=0){ p.hp=0; killPlayer(p,cause); }
}
function killPlayer(p,cause){
  p.alive=false; p.ghost=true; p.ghostDrainTotal=0;
  log(p.name+" 死亡（"+cause+"），於停屍間化為暗影...","dmg");
  // drop items into mortuary
  const embalmers=STATE.players.filter(x=>x.alive && x.prof==="embalmer");
  p.inv.forEach(it=>{
    if(embalmers.length){
      const e=embalmers[0];
      if(e.flags.embalmerChoiceMode){ e.inv.push(it); e.flags.embalmerChoiceMode=false; log(e.name+" 以亡者遺贈自行選擇獲得: "+ITEMS[it].name); return; }
      if(!e.flags.__embalmerGotThisRound){ e.inv.push(it); e.flags.__embalmerGotThisRound=true; log(e.name+" 蠱耗感應獲得: "+ITEMS[it].name); return; }
    }
    ROOMS["B701"].stock[it]=(ROOMS["B701"].stock[it]||0)+1;
  });
  p.inv=[];
  p.room="B701";
  embalmers.forEach(e=>{ e.carry++; });
  // shade immunity/heal handled in ghost-drain resolution; 暗影親和 speed+2
  if(p.prof==="shade"){ /* becomes ghost itself, unaffected by others' drains as it's now a ghost too */ }
  STATE.players.forEach(x=>{ if(x.prof==="shade" && x.alive) {/* passive noted */} });
  if(p.prof==="shade"){ p.speed+=2; }
}

function resolvePoisonVote(){
  let winner=null, best=-1;
  for(const [r,c] of Object.entries(STATE.voteCounts)){ if(c>best){ best=c; winner=r; } }
  if(!winner) return;
  const room=ROOMS[winner];
  if(room.poisonRequires){
    if(room.poisonRequires.every(r=>STATE.poisoned.has(r))) STATE.poisoned.add(winner);
  } else {
    STATE.poisoned.add(winner);
  }
  log("本輪毒氣投票結果：「"+winner+" "+(room.name||"")+"」"+(STATE.poisoned.has(winner)?"淪為毒氣區域！":"（尚未滿足毒氣條件）"));
}
function poisonDamageForRound(){
  const r=STATE.round;
  if(r===1) return 1;
  if(r===2||r===3) return 2;
  if(r===4||r===5) return 3;
  return 4;
}
function settleRound(){
  STATE.phase="settlement";
  log("<b>── 進入結算階段 ──</b>");

  // 1) queued item-card effects (水/糧/藥片/腎上腺素/酒 — all "結算階段公開使用")
  STATE.players.forEach(p=>{ if(p.alive) resolvePendingItemUses(p); });

  // surgery healing (triggered earlier when the room was visited; resolves alongside items)
  STATE.players.forEach(p=>{
    if(p.flags.__surgeryHeal){ p.hp=Math.min(p.maxhp,p.hp+4); p.flags.__surgeryHeal=false; log(p.name+" 於手術室恢復4點生命。","heal"); }
  });

  // 2) combat resolution per room
  const roomGroups={};
  STATE.players.forEach(p=>{ if(p.alive && !p.ghost){ (roomGroups[p.room]=roomGroups[p.room]||[]).push(p); } });
  Object.entries(roomGroups).forEach(([r,group])=>{
    if(group.length<2) return;
    if(r==="B202"){ if(group.length===2) return; } // healing handled above; 2p no combat
    // outsider: if room has 3+ alive, they sit out
    const fighters=group.filter(p=>!(p.prof==="outsider" && group.length>=3));
    if(fighters.length<2){
      group.filter(p=>p.prof==="outsider" && group.length>=3).forEach(p=>{ p.hp=Math.min(p.maxhp,p.hp+1); });
      return;
    }
    // free-for-all: everyone compares to the strongest present; simplistic pairwise settlement
    for(let i=0;i<fighters.length;i++){
      for(let j=i+1;j<fighters.length;j++){
        const a=fighters[i], b=fighters[j];
        if(!a.alive||!b.alive) continue;
        resolveCombat(a,b,r);
      }
    }
    group.filter(p=>p.prof==="outsider" && group.length>=3).forEach(p=>{ p.hp=Math.min(p.maxhp,p.hp+1); });
  });

  // rocket launcher (declared during action phase, resolves as part of this round's violence)
  (STATE.rocketTargets||[]).forEach(r=>{
    playersInRoom(r,true).forEach(p=>{
      let dmg=4;
      if(p.prof==="bomb") dmg=Math.max(0,dmg-1);
      damagePlayer(p,dmg,"火箭筒");
      log(p.name+" 被火箭筒轟炸於「"+r+"」，受到 "+dmg+" 點傷害。","dmg");
    });
  });
  STATE.rocketTargets=[];

  // trucker ram (declared during action phase via 卸載加速, resolves here too)
  STATE.players.forEach(p=>{
    if(p.flags.truckerJustUsed){
      playersInRoom(p.room,true).filter(x=>x.id!==p.id).forEach(x=>{ damagePlayer(x,1,"貨車司機猛烈衝撞"); });
      log(p.name+" 觸發猛烈衝撞：房內其他玩家各受到1點傷害，房間強制公開。");
      p.flags.truckerJustUsed=false; p.flags.truckerDoubled=false;
    }
  });

  // 3) poison
  resolvePoisonVote();
  const baseDmg=poisonDamageForRound() + (STATE.poisonBoost?2:0);
  STATE.players.forEach(p=>{
    if(!p.alive || p.ghost) return;
    if(STATE.poisoned.has(p.room)){
      let dmg=baseDmg;
      if(p.room===STATE.poisonReduceRoom) dmg=Math.max(0,dmg-2);
      if(p.inv.includes("gasmask")) dmg=0;
      if(p.room==="202") dmg=0;
      if(p.prof==="chemist") dmg=Math.max(0,dmg-1);
      damagePlayer(p,dmg,"毒氣");
      if(dmg>0) log(p.name+" 在毒氣區受到 "+dmg+" 點傷害。","dmg");
    }
  });
  STATE.poisonReduceRoom=null; STATE.poisonBoost=false;

  // 4) hunger (round>=2)
  if(STATE.round>=2){
    STATE.players.forEach(p=>{
      if(!p.alive || p.ghost) return;
      if(p.flags.dietThisRound || p.room==="B204") return;
      let missing=0;
      if(!p.flags.consumed_water) missing++;
      if(!p.flags.consumed_food) missing++;
      if(missing>0){ damagePlayer(p,missing,"飢餓"); log(p.name+" 缺水/糧，受到 "+missing+" 點傷害。","dmg"); }
    });
  }

  // 5) laser room
  STATE.players.forEach(p=>{
    if(p.alive && p.pendingLaser){ damagePlayer(p,1,"激光室"); p.pendingLaser=false; }
  });

  // 6) ghost drains
  STATE.players.forEach(g=>{
    if(!g.ghost) return;
    const victims=playersInRoom(g.room,true).filter(x=>!x.ghost);
    victims.forEach(v=>{
      if(v.prof==="shade"){
        log(v.name+"（暗影使者）免疫暗影吸血。"); return;
      }
      damagePlayer(v,1,"暗影吸血");
      g.ghostDrainTotal++;
      log(g.name+"（暗影）吸取了 "+v.name+" 1點生命。","dmg");
      STATE.players.forEach(sh=>{ if(sh.prof==="shade" && sh.alive && !sh.ghost){ sh.hp=Math.min(sh.maxhp,sh.hp+1); log(sh.name+"（暗影共鳴）恢復1點生命。","heal"); } });
    });
    if(g.ghostDrainTotal>=2){
      g.ghost=false; g.alive=true; g.hp=Math.min(g.maxhp, Math.max(3,g.ghostDrainTotal));
      log(g.name+" 吸滿2點生命，於「"+g.room+"」復活！(HP "+g.hp+")","heal");
    }
  });

  // adrenaline: apply next-round speed, then clear
  STATE.players.forEach(p=>{
    if(p.flags.adrenalineActive){
      p.flags.adrenalineNextSpeed=10;
    } else {
      p.flags.adrenalineNextSpeed=null;
    }
    p.flags.adrenalineActive=false;
    p.flags.consumed_water=false; p.flags.consumed_food=false;
    p.flags.roomLocked=false; p.flags.voteWeight=1;
    p.flags.__embalmerGotThisRound=false;
    p.flags.climberVertical=false;
  });

  renderAll();
  showRoundSummary();
}
function resolveCombat(a,b,roomId){
  const roomIsOR = roomId==="B202";
  const aGun=hasGun(a), bGun=hasGun(b);
  let dmgToA=0, dmgToB=0;
  if(bGun && !aGun){ dmgToA=combatPower(b); }
  else if(aGun && !bGun){ dmgToB=combatPower(a); }
  else {
    const diff=combatPower(a)-combatPower(b);
    if(diff>0) dmgToB=diff; else if(diff<0) dmgToA=-diff;
  }
  // profession damage reduction (肥宅, 防爆小組 vs gun)
  const reduce=(p,dmg,attackerHasGun)=>{
    let d=dmg;
    if(p.prof==="fatty") d=Math.max(0,d-2);
    if(p.prof==="bomb" && attackerHasGun) d=Math.max(0,d-3);
    return d;
  };
  dmgToA=reduce(a,dmgToA,bGun);
  dmgToB=reduce(b,dmgToB,aGun);
  if(dmgToA>0){ damagePlayer(a,dmgToA,"與"+b.name+"戰鬥"); log(a.name+" 在「"+roomId+"」戰鬥中受到 "+dmgToA+" 點傷害（對手 "+b.name+"）。","dmg"); }
  if(dmgToB>0){ damagePlayer(b,dmgToB,"與"+a.name+"戰鬥"); log(b.name+" 在「"+roomId+"」戰鬥中受到 "+dmgToB+" 點傷害（對手 "+a.name+"）。","dmg"); }
  if(dmgToA===0 && dmgToB===0) log(a.name+" 與 "+b.name+" 在「"+roomId+"」武力相同，未分勝負。");
}

function showRoundSummary(){
  const alive=alivePlayers();
  let html="<h3>第 "+STATE.round+" 輪結算</h3><div class='mono' style='font-size:12px'>";
  STATE.players.forEach(p=>{ html+= p.name+"("+PROFESSIONS[p.prof].name+"): HP "+p.hp+(p.ghost?" [暗影]":p.alive?"":" [死亡]")+"<br>"; });
  html+="</div><button class='btn small' id='sumOk'>繼續</button>";
  openModal(html);
  document.getElementById("sumOk").onclick=()=>{
    closeModal();
    if(STATE.round>=6){ endGame(); }
    else { STATE.round++; STATE.phase="positioning";
      STATE.players.forEach(p=>{ if(p.flags.adrenalineNextSpeed){ p.speed_backup=p.speed; p.speed=p.flags.adrenalineNextSpeed; p.flags.__adrenalineRestoreNext=true; } else if(p.flags.__adrenalineRestoreNext){ p.speed=p.speed_backup; p.flags.__adrenalineRestoreNext=false; } });
      logRound(STATE.round); beginRound(); }
  };
}
function endGame(){
  STATE.gameOver=true;
  document.getElementById("game").classList.add("hidden");
  const ranked=[...STATE.players].sort((a,b)=>b.hp-a.hp);
  const list=document.getElementById("rankList");
  list.innerHTML="";
  ranked.forEach((p,i)=>{
    const div=document.createElement("div"); div.className="rank-row";
    div.innerHTML="<span>#"+(i+1)+" "+p.name+" ("+PROFESSIONS[p.prof].name+")"+(p.alive?"":" 💀")+"</span><span class='mono'>HP "+p.hp+"</span>";
    list.appendChild(div);
  });
  document.getElementById("endScreen").classList.remove("hidden");
}

/* ===================== RENDER ===================== */
function renderAll(){
  if(STATE.gameOver) return;
  const p=you();
  document.getElementById("roundNo").textContent=STATE.round;
  document.getElementById("phaseName").textContent="行動階段";
  document.getElementById("youName").textContent=p.name;
  document.getElementById("youProf").textContent=PROFESSIONS[p.prof].name;
  document.getElementById("hpBar").style.width=Math.max(0,(p.hp/p.maxhp*100))+"%";
  document.getElementById("hpText").textContent="HP "+p.hp+"/"+p.maxhp;
  document.getElementById("stPower").textContent=combatPower(p);
  document.getElementById("stSpeed").textContent=p.speed;
  document.getElementById("stCarry").textContent=p.carry;
  document.getElementById("curRoom").textContent=p.room+" "+(ROOMS[p.room].name||"");
  document.getElementById("stepsLeft").textContent=p.stepsLeft;
  document.getElementById("carryUsed").textContent=usedCarry(p);
  document.getElementById("carryCap").textContent=effectiveCarryCap(p)>9000?"∞":effectiveCarryCap(p);

  // inventory
  const invEl=document.getElementById("inventory"); invEl.innerHTML="";
  const counts={};
  p.inv.forEach(i=>counts[i]=(counts[i]||0)+1);
  Object.entries(counts).forEach(([id,n])=>{
    const div=document.createElement("div"); div.className="inv-item";
    let actions="";
    if(["water","food","pill","adrenaline","wine"].includes(id)) actions+=`<button class="btn small" data-use="${id}">使用</button>`;
    if(id==="gold") actions+=`<button class="btn small gold" data-gold="1">用於本房</button>`;
    if(id==="rocket") actions+=`<button class="btn small warn" data-rocket="1">瞄準</button>`;
    if(id==="recycledevice") actions+=`<button class="btn small" data-recycle="1">回收抽取</button>`;
    div.innerHTML=`<span>${ITEMS[id].name} x${n}</span><span class="actions">${actions}</span>`;
    invEl.appendChild(div);
  });
  invEl.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>useItem(p,b.dataset.use));
  invEl.querySelectorAll("[data-gold]").forEach(b=>b.onclick=()=>useGoldAtRoom(p));
  invEl.querySelectorAll("[data-rocket]").forEach(b=>b.onclick=()=>useRocket(p));
  invEl.querySelectorAll("[data-recycle]").forEach(b=>b.onclick=()=>useRecycleDevice(p));
  if(p.flags.pendingItemUses && p.flags.pendingItemUses.length){
    const pend=document.createElement("div"); pend.className="muted mono"; pend.style.fontSize="11px"; pend.style.marginTop="6px";
    pend.textContent="本輪已宣告使用（結算階段生效）: "+p.flags.pendingItemUses.map(i=>ITEMS[i].name).join("、");
    invEl.appendChild(pend);
  }

  // skills
  const skEl=document.getElementById("skillList"); skEl.innerHTML="";
  PROFESSIONS[p.prof].skills.forEach((s,idx)=>{
    const btn=document.createElement("button"); btn.className="skillbtn";
    let usesLeft="";
    if(p.prof==="gambler"&&idx===0) usesLeft=" ("+(3-p.flags.gamblerUses)+"/3)";
    if(p.prof==="gambler"&&idx===1) usesLeft=" ("+(1-p.flags.gamblerWinUses)+"/1)";
    if(p.prof==="scavenger"&&idx===1) usesLeft=" ("+(2-p.flags.scavengerUses)+"/2)";
    if(p.prof==="trucker"&&idx===0) usesLeft=" ("+(3-p.flags.truckerUses)+"/3)";
    if(p.prof==="chemist"&&idx===0) usesLeft=" ("+(2-p.flags.chemistUses)+"/2)";
    if(p.prof==="hacker"&&idx===1) usesLeft=" ("+(2-p.flags.hackerUses)+"/2)";
    if(p.prof==="tamer"&&idx===0) usesLeft=" ("+(4-p.flags.tamerUses)+"/4)";
    if(p.prof==="geneFreak"&&idx===1) usesLeft=" ("+(2-p.flags.geneUses)+"/2)";
    if(p.prof==="climber"&&idx===1) usesLeft=" ("+(p.flags.climberDietUsed?0:1)+"/1)";
    btn.innerHTML=`<b>${s.name}${usesLeft}</b>${s.desc}`;
    if(s.passive){ btn.disabled=true; btn.title="被動技能，自動生效"; }
    else { btn.onclick=()=>useProfSkill(p,idx); }
    skEl.appendChild(btn);
  });

  // map
  const mapEl=document.getElementById("mapArea"); mapEl.innerHTML="";
  const reach=reachableRooms(p.room,p.stepsLeft);
  const floors={};
  Object.values(ROOMS).forEach(r=>{ (floors[r.floor]=floors[r.floor]||[]).push(r); });
  Object.keys(floors).sort((a,b)=>a-b).forEach(fl=>{
    const row=document.createElement("div"); row.className="floor-row";
    const lbl=document.createElement("span"); lbl.className="floor-label"; lbl.textContent=FLOOR_LABEL[fl];
    row.appendChild(lbl);
    floors[fl].sort((a,b)=>a.order-b.order).forEach(r=>{
      const chip=document.createElement("div"); chip.className="room-chip";
      if(r.id===p.room) chip.classList.add("here");
      else if(reach[r.id]!==undefined) chip.classList.add("reachable");
      if(STATE.poisoned.has(r.id)) chip.classList.add("poison");
      const occAlive=STATE.players.filter(x=>x.room===r.id && x.alive && !x.ghost);
      const fattyHere=STATE.players.find(x=>x.prof==="fatty" && x.alive && x.room===r.id);
      let occTxt="";
      if(r.id===p.room) occTxt=occAlive.length>1?String(occAlive.length):"";
      else if(fattyHere) occTxt="肥";
      chip.innerHTML=`${r.id}${r.name?("<small>"+r.name+"</small>"):""}`+(occTxt?`<span class="occ">${occTxt}</span>`:"");
      chip.onclick=()=>onRoomClick(r.id);
      row.appendChild(chip);
    });
    mapEl.appendChild(row);
  });

  // room actions
  const raEl=document.getElementById("roomActions"); raEl.innerHTML="";
  const room=ROOMS[p.room];
  if(room.draw>0 || room.special){
    const btn=document.createElement("button"); btn.className="btn small";
    btn.textContent = room.special==="gene"?"使用基因庫" : room.special==="respec"?"重新分配點數" :
      room.special==="slide"?"滑向垃圾場(1步)" : room.special==="teleport"?"傳送" : room.special==="control"?"控制室功能" :
      room.special==="helipad"?"領取空投" : room.draw>0?"搜索房間 (最多"+room.draw+"張)" : "使用房間功能";
    if(p.flags.roomLocked){ btn.disabled=true; btn.title="好賭成性失敗，本輪無法房間操作"; }
    btn.onclick=doRoomAction;
    raEl.appendChild(btn);
  } else {
    raEl.innerHTML="<span class='muted'>此房間無特殊功能</span>";
  }
  if(room.special==="laser") log_once(p,"laser-"+STATE.round,()=>{ applyLaser(p); log(p.name+" 經過激光室，結算時將扣1點生命。","dmg"); });

  // here list
  const hereEl=document.getElementById("hereList");
  const others=playersInRoom(p.room,false).filter(x=>x.id!==p.id);
  hereEl.textContent = others.length? others.map(x=>x.name+(x.ghost?"[暗影]":"")).join("、") : "（無其他玩家）";

  // all players
  const apEl=document.getElementById("allPlayers"); apEl.innerHTML="";
  STATE.players.forEach(pl=>{
    const line=document.createElement("div");
    line.textContent=pl.name+" ["+PROFESSIONS[pl.prof].name+"] HP:"+pl.hp+(pl.ghost?" 暗影":pl.alive?"":" 💀");
    apEl.appendChild(line);
  });

  document.getElementById("topStatus").innerHTML=`<span class="badge">回合 ${STATE.round}/6</span>`;
}
function log_once(p,key,fn){
  p.flags.__onceKeys=p.flags.__onceKeys||new Set();
  if(p.flags.__onceKeys.has(key)) return;
  p.flags.__onceKeys.add(key); fn();
}
</script>
